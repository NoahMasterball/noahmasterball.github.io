     data-title="Phalaena Maior – Mothman Constellation"
     data-description="Mothman as the constellation Phalaena Maior: a dark upright figure in front of wide, pale moth wings with eye spots and feathered antennae. Glitter sticker from the cryptid constellation series."
     data-cryptid="Mothman"
     data-direction="D"
     data-finish="glitter"
     data-palettes="starmap"
     data-mechanic="none"
     data-note="Mothman als Sternbild ‚Phalaena Maior‘: dunkle, aufrechte Gestalt vor weit gespannten, hellen Mottenflügeln mit Augenflecken und gefiederten Fühlern; die zwei Augen sind die hellsten Sterne. Eigene Form (weiche Mottenflügel statt Statue/Film). Glitter = Sterne.">

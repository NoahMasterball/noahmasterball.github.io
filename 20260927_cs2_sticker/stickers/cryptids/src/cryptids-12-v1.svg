<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024"
     data-title="Kraken Constellation"
     data-description="The Kraken as a constellation without a name: mantle on top, six curled arms filling the star disc, the eyes are the brightest stars. Glitter sticker from the cryptid constellation series."
     data-cryptid="Kraken"
     data-direction="D"
     data-finish="glitter"
     data-palettes="starmap"
     data-mechanic="none"
     data-note="Kraken als Sternbild ohne Schrift: Mantel oben, sechs eingerollte Arme füllen die vergrößerte Scheibe; die Augen sind die hellsten Sterne, Sternketten laufen vom Mund in die eingerollten Armspitzen; feine Saugnapf-Ringe als Detail. Glitter = Sterne.">

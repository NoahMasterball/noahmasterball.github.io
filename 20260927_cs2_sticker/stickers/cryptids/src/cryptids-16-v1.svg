    <path id="head" d="M 600,250 Q 587,243 575,226 Q 586,223 589,220 Q 579,210 573,188 Q 586,191 590,190 Q 584,179 583,158 Q 593,160 597,159 Q 592,146 595,123 Q 605,132 610,132 Q 609,120 616,102 Q 624,109 628,110 Q 629,97 643,80 Q 645,95 648,98 C 661,95 678,107 690,116 C 702,125 713,144 722,154 C 731,164 743,170 746,178 C 749,186 742,194 742,200 C 742,206 742,208 746,214 C 750,220 762,230 764,236 C 766,242 757,247 758,252 C 759,257 768,262 768,268 C 768,274 765,284 758,290 C 751,296 739,302 726,304 C 713,306 701,311 680,302 C 659,293 615,269 600,250 Z"/>

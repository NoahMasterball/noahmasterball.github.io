  <!-- Taste: Stanzrand, Seitenwände, Oberseite, Beschriftung -->
  <use href="#keySil" class="f-outline s-outline w-outline"/>
  <use href="#keySil" class="f-ink s-ink w-bold"/>
  <g class="s-ink w-line">
    <use href="#keySkirt" class="f-shade"/>
    <use href="#keyTop" class="f-paper"/>
    <rect x="160" y="690" width="700" height="30" class="f-shade" stroke="none" opacity="0.6" clip-path="url(#keyTopClip)"/>
    <path d="M 214,712 H 810" fill="none" class="s-glow w-line" opacity="0.8"/>
    <use href="#keyTop" fill="none"/>
  </g>
  <g class="f-accent">
    <path d="M 250,788 L 290,748 L 330,788 H 308 V 828 H 272 V 788 Z"/>
    <text x="358" y="834" font-size="104" font-weight="bold" class="t-sans">SHIFT</text>
  </g>

  <!-- Bigfoot: Stanzrand, Außenkontur, Flächen mit Innenlinien -->
  <use href="#beastSil" class="f-outline s-outline w-outline"/>
  <use href="#beastSil" class="f-ink s-ink w-bold"/>
  <g class="s-ink w-line">
    <use href="#farLeg" class="f-accent2"/>
    <use href="#farLeg" class="f-ink" stroke="none" opacity="0.32"/>
    <use href="#farFoot" class="f-shade"/><use href="#farToes" class="f-shade"/>
    <use href="#torso" class="f-accent2"/>
    <g clip-path="url(#torsoClip)" stroke="none" class="f-ink" opacity="0.18">
      <path d="M 300,180 L 480,200 C 440,280 440,400 500,470 C 560,520 640,510 720,470 L 720,600 L 300,600 Z"/>
    </g>
    <use href="#nearLeg" class="f-accent2"/>
    <use href="#nearFoot" class="f-shade"/>
    <use href="#nearToes" class="f-shade"/>
    <use href="#head" class="f-accent2"/>
    <use href="#face" class="f-shade"/>
    <ellipse cx="722" cy="206" rx="15" ry="12" class="f-glow"/>
    <circle cx="714" cy="208" r="6" class="f-ink" stroke="none"/>
    <path d="M 698,186 C 716,178 738,176 750,184" fill="none" class="s-ink w-bold"/>
    <use href="#nearArm" class="f-accent2"/>
    <use href="#fist" class="f-shade"/>
    <use href="#finger" class="f-shade"/>
  </g>
</svg>

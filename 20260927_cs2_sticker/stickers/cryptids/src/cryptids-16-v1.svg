<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024" width="1024" height="1024"
     stroke-linejoin="round" stroke-linecap="round"
     data-title="Bigfoot – Shift Walk"
     data-description="Bigfoot is known for huge, loud footprints – here he tiptoes across a giant SHIFT key, finger on his lips. Paper sticker from the de_wildlife series."
     data-cryptid="Bigfoot"
     data-direction="E"
     data-finish="paper"
     data-palettes="dust"
     data-mechanic="none"
     data-note="Bigfoot ist berühmt für seine riesigen, lauten Schritte – hier schleicht er auf Zehenspitzen über eine riesige SHIFT-Taste, Finger auf den Lippen: Shift-Walk, damit ihn keiner hört.">

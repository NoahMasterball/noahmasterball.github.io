    <!-- Silhouette = SSoT für Stanzrand und Außenkontur -->
    <g id="beastSil">
      <use href="#farSide"/><use href="#torso"/><use href="#head"/>
      <use href="#nearLeg"/><use href="#nearFoot"/><use href="#nearToes"/><use href="#nearArm"/><use href="#fist"/><use href="#finger"/>

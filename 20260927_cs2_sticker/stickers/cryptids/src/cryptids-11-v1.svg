     data-title="Cetus Lacustris – Nessie Constellation"
     data-description="Nessie as the constellation Cetus Lacustris, the lake monster: long neck and two humps rising from the loch, traced by a chain of stars. Holo sticker from the cryptid constellation series."
     data-cryptid="Loch Ness Monster"
     data-direction="D"
     data-finish="holo"
     data-palettes="starmap"
     data-mechanic="none"
     data-note="Nessie als Sternbild ‚Cetus Lacustris‘ (See-Ungeheuer): langer Hals und zwei Buckel ragen aus dem See, die Sternkette läuft vom Kopf über die Buckel zur Schwanzspitze. Gleiche Scheibe + Band wie Pes Magnus; Holo auf Himmel und Wasser.">

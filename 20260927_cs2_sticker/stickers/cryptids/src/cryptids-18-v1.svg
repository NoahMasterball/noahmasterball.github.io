<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024" width="1024" height="1024"
     stroke-linejoin="round" stroke-linecap="round"
     data-title="Loch Ness Monster – Long"
     data-description="LONG is the most famous callout and Nessie has the longest neck. She stretches over the wall from the moor water and holds the angle. Holo sticker from the de_wildlife series."
     data-cryptid="Loch Ness Monster"
     data-direction="E"
     data-finish="holo"
     data-palettes="dust"
     data-mechanic="none"
     data-note="‚LONG‘ ist der berühmteste Callout – und Nessie hat den längsten Hals. Sie reckt ihn aus dem Moorwasser über die Wand und hält den Winkel auf Long. Callout = Körperbau.">
  <defs>
    <!-- LONG (eigene Lettern), Höhe 220 -->
    <g id="wordLONG">
      <path d="M 0,0 H 64 V 162 H 170 V 220 H 0 Z"/>
      <path fill-rule="evenodd" d="M 298,0 C 360,0 400,46 400,110 C 400,174 360,220 298,220 C 236,220 196,174 196,110 C 196,46 236,0 298,0 Z M 298,58 C 272,58 258,80 258,110 C 258,140 272,162 298,162 C 324,162 338,140 338,110 C 338,80 324,58 298,58 Z"/>
      <path d="M 426,220 V 0 H 486 L 556,118 V 0 H 616 V 220 H 556 L 486,102 V 220 Z"/>
      <path d="M 838,58 C 822,20 790,0 746,0 C 684,0 642,46 642,110 C 642,174 684,220 746,220 C 792,220 828,198 842,160 V 96 H 748 V 146 H 788 C 780,158 766,164 746,164 C 720,164 704,142 704,110 C 704,78 720,56 746,56 C 764,56 776,64 782,78 Z"/>
    </g>
    <!-- Nessie -->
    <path id="neck" d="M 905,784 C 925,763 907,692 910,646 C 913,599 921,551 924,505 C 927,459 929,412 927,369 C 925,327 920,285 910,250 C 900,215 884,183 865,159 C 847,135 820,117 801,106 C 781,95 759,85 747,94 C 736,102 729,146 733,158 C 736,170 755,159 767,166 C 780,173 795,184 807,201 C 818,218 828,241 834,270 C 840,298 842,333 841,371 C 840,408 835,451 828,495 C 822,539 809,587 802,634 C 795,681 770,751 787,776 C 804,801 884,806 905,784 Z"/>
    <path id="head" d="M 770,104 C 763,93 743,86 730,84 C 717,82 703,85 690,90 C 677,95 663,104 652,112 C 641,120 631,132 626,140 C 621,148 620,154 622,160 C 624,166 629,173 640,176 C 651,179 673,179 690,178 C 707,177 727,173 740,168 C 753,163 765,161 770,150 C 775,139 777,115 770,104 Z"/>
    <path id="horns" d="M 705,80 A 11,16 0 1,0 727,80 A 11,16 0 1,0 705,80 Z M 731,86 A 11,16 0 1,0 753,86 A 11,16 0 1,0 731,86 Z"/>
    <path id="hump1" d="M 186,790 C 178,773 189,722 201,690 C 212,658 235,616 253,598 C 271,580 290,580 308,580 C 326,580 345,580 363,598 C 381,616 404,658 415,690 C 427,722 438,773 430,790 C 422,807 381,800 370,790 C 359,780 369,752 364,730 C 359,708 348,671 339,656 C 330,641 318,640 308,640 C 298,640 286,641 277,656 C 268,671 257,708 252,730 C 247,752 257,780 246,790 C 235,800 194,807 186,790 Z"/>
    <path id="hump2" d="M 460,790 C 452,773 464,725 475,690 C 487,655 512,600 530,578 C 549,556 569,560 588,560 C 607,560 627,556 646,578 C 664,600 689,655 701,690 C 712,725 724,773 716,790 C 708,807 665,800 654,790 C 643,780 653,755 647,730 C 642,705 631,656 621,638 C 611,620 599,622 588,622 C 577,622 565,620 555,638 C 545,656 534,705 529,730 C 523,755 533,780 522,790 C 511,800 468,807 460,790 Z"/>
    <path id="tail" d="M 110,760 C 99,748 95,710 96,690 C 97,670 109,650 118,640 C 127,630 143,627 150,630 C 157,633 162,653 160,660 C 158,667 144,665 140,672 C 136,679 132,685 136,700 C 140,715 166,750 162,760 C 158,770 121,772 110,760 Z"/>
    <g id="beastSil">
      <use href="#tail"/><use href="#hump1"/><use href="#hump2"/><use href="#neck"/><use href="#horns"/><use href="#head"/>
    </g>
    <clipPath id="neckClip"><use href="#neck"/></clipPath>
    <!-- Moorwasser -->
    <path id="water" d="M 50,742 C 100,722 150,722 200,740 C 250,758 290,758 340,740 C 390,722 430,722 480,740 C 530,758 570,758 620,740 C 670,722 710,722 760,740 C 810,758 850,758 900,740 C 930,730 956,728 974,736 C 990,760 980,800 940,826 C 860,876 690,900 512,900 C 334,900 164,876 84,826 C 44,800 34,760 50,742 Z"/>
    <clipPath id="waterClip"><use href="#water"/></clipPath>
  </defs>

  <!-- Wand (Teil e-wall) mit gesprühtem Callout -->
  <g data-include="e-wall" transform="translate(-100,60)">
    <use href="#wordLONG" class="f-accent" transform="translate(222,142) scale(0.72)"/>
  </g>

  <!-- Nessie: Stanzrand, Außenkontur, Flächen mit Innenlinien -->
  <use href="#beastSil" class="f-outline s-outline w-outline"/>
  <use href="#beastSil" class="f-ink s-ink w-bold"/>
  <g class="s-ink w-line">
    <use href="#tail" class="f-accent2"/>
    <use href="#hump1" class="f-accent2"/>
    <use href="#hump2" class="f-accent2"/>
    <use href="#neck" class="f-accent2"/>
    <g clip-path="url(#neckClip)" stroke="none">
      <path d="M 700,150 C 780,170 830,240 840,360 C 846,480 830,620 806,800 L 760,800 L 760,150 Z" class="f-glow" opacity="0.35"/>
      <g class="f-ink" opacity="0.28">
        <ellipse cx="892" cy="560" rx="14" ry="22"/><ellipse cx="900" cy="440" rx="12" ry="18"/><ellipse cx="894" cy="320" rx="10" ry="15"/>
      </g>
    </g>
    <use href="#horns" class="f-accent"/>
    <use href="#head" class="f-accent2"/>
    <circle cx="700" cy="118" r="20" class="f-glow"/>
    <circle cx="694" cy="126" r="9" class="f-ink" stroke="none"/>
    <circle cx="690" cy="120" r="3.5" class="f-outline" stroke="none"/>
    <path d="M 640,166 C 660,172 684,170 704,160" fill="none"/>
    <circle cx="636" cy="142" r="4" class="f-ink" stroke="none"/>
    <g class="f-ink" stroke="none" opacity="0.28">
      <ellipse cx="236" cy="660" rx="10" ry="15"/><ellipse cx="308" cy="600" rx="14" ry="9"/><ellipse cx="384" cy="660" rx="10" ry="15"/>
      <ellipse cx="512" cy="640" rx="10" ry="15"/><ellipse cx="588" cy="580" rx="14" ry="9"/><ellipse cx="668" cy="640" rx="10" ry="15"/>
    </g>
  </g>

  <!-- Wasser: Stanzrand, Fläche, Wellen -->
  <use href="#water" class="f-outline s-outline w-outline"/>
  <use href="#water" class="f-accent2"/>
  <use href="#water" class="f-ink" opacity="0.5"/>
  <g clip-path="url(#waterClip)" fill="none" class="s-glow w-line" opacity="0.7">
    <path d="M 120,800 C 150,790 180,790 210,800 M 420,790 C 450,780 480,780 510,790 M 700,820 C 740,808 780,808 820,820 M 260,850 C 290,840 320,840 350,850 M 560,862 C 590,852 620,852 650,862"/>
  </g>
  <use href="#water" fill="none" class="s-ink w-bold"/>
  <g fill="none" class="s-outline w-line">
    <path d="M 770,770 C 800,786 900,786 930,770 M 190,776 C 220,790 390,790 420,776 M 428,776 C 460,790 640,790 672,776"/>
  </g>
</svg>

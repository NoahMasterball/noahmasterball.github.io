<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Richtung D ohne Namensband: Stanzform + Scheibe mittig und vergrößert, darauf #art — das definiert
       der Sticker in <defs> als <g id="art"> (Sternfeld, Figur, Linien, Sterne) in Scheiben-Koordinaten
       von d-disc (Mitte 512 466, Himmel r=368). -->
  <g transform="translate(512 512) scale(1.1) translate(-512 -466)">
    <g data-include="d-cut"/>
    <g data-include="d-disc"/>
    <use xlink:href="#art"/>
  </g>
</svg>

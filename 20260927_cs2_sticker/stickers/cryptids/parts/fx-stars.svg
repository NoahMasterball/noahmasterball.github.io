<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Richtungsübergreifend: Glitzerstern #d-star (Halo + Funke #d-spark) und Schein-Filter #d-soft.
       Nur Defs — in <defs> einbinden. Genutzt von d-disc (Sternbilder) und h-window (Dreamcore).
       ids behalten das d-Präfix, weil die Sternbild-Sticker sie so referenzieren. -->
  <defs>
    <radialGradient id="d-halo">
      <stop offset="0" class="sc-glow" stop-opacity="0.5"/>
      <stop offset="1" class="sc-glow" stop-opacity="0"/>
    </radialGradient>
    <filter id="d-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <path id="d-spark" d="M0 -40C5 -11 11 -5 40 0C11 5 5 11 0 40C-5 11 -11 5 -40 0C-11 -5 -5 -11 0 -40Z"/>
    <g id="d-star">
      <circle r="50" fill="url(#d-halo)"/>
      <use xlink:href="#d-spark" class="f-glow"/>
      <circle r="10" class="f-glow"/>
    </g>
  </defs>
</svg>

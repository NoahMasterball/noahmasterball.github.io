<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fronts — 2D-Weltstrategie</title>
    <link rel="stylesheet" href="assets/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- Hauptmenü -->
      <section id="scene-menu" class="scene active">
        <h1 class="menu-title">Fronts</h1>
        <p class="menu-subtitle" id="menu-subtitle">Wähle deinen Spielmodus</p>
        <button class="btn-back menu-back" id="menu-back" style="display: none">← Zurück</button>

        <!-- Stufe 1: Spieltyp-Auswahl (datengetrieben aus GAME_TYPES) -->
        <div id="gametype-grid" class="mode-grid"></div>

        <!-- Stufe 2a: Strategie-Modi (datengetrieben aus MODES) -->
        <div id="strategy-panel" class="menu-panel" style="display: none">
          <div id="mode-grid" class="mode-grid"></div>
        </div>

        <!-- Stufe 2b: MCF-Shooter-Setup (datengetrieben befüllt) -->
        <div id="shooter-panel" class="menu-panel" style="display: none"></div>

        <footer class="menu-footer">Fronts — Strategie & MCF-Shooter</footer>
      </section>

      <!-- Spielszene: Canvas-Weltkarte + UI-Overlay (datengetrieben befüllt) -->
      <section id="scene-game" class="scene">
        <canvas id="game-canvas"></canvas>
        <!-- HUD, Seitenpanel und Hinweise werden von ui/panel.js eingefügt -->
        <div id="game-ui"></div>
        <div id="game-loading" class="game-loading"></div>
      </section>

      <!-- MCF-Shooter-Szene: Canvas + HUD-Overlay (von shooter/hud.js befüllt) -->
      <section id="scene-shooter" class="scene">
        <canvas id="shooter-canvas"></canvas>
        <div id="shooter-ui"></div>
      </section>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>

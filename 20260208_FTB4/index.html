<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emberwick Vale</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0e14'/%3E%3Ccircle cx='8' cy='8' r='5' fill='%23d9a45b'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b0e14;
        color: #cbd3e1;
        z-index: 10;
        transition: opacity 0.6s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Once the scene renders behind it, the title screen lets it show through. */
      #loading.ready {
        background: rgba(11, 14, 20, 0.45);
        transition: background 1.2s ease, opacity 0.6s ease;
      }
      #loading.ready .title {
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
      }
      #loading.ready #controls-hint {
        color: #cbd3e1;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      }
      #loading .title {
        font-size: 22px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #e8dcc2;
      }
      #loading .bar {
        width: 240px;
        height: 3px;
        background: #232a38;
        border-radius: 2px;
        overflow: hidden;
      }
      #loading .bar > div {
        height: 100%;
        width: 0%;
        background: #d9a45b;
        transition: width 0.2s ease;
      }
      #start-btn {
        display: none;
        margin-top: 6px;
        padding: 12px 46px;
        font-family: inherit;
        font-size: 17px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #0b0e14;
        background: #d9a45b;
        border: 1px solid #e8dcc2;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
      }
      #start-btn:hover {
        background: #e8bd7a;
        box-shadow: 0 0 24px rgba(217, 164, 91, 0.45);
      }
      #start-btn:active {
        transform: scale(0.97);
      }
      #controls-hint {
        display: none;
        margin-top: 10px;
        color: #8d97ab;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
      #boot-error {
        display: none;
        max-width: 560px;
        margin-top: 14px;
        padding: 14px 18px;
        color: #ffd9d9;
        background: rgba(90, 24, 24, 0.55);
        border: 1px solid #a34545;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
      }
      #version-tag {
        position: absolute;
        right: 16px;
        bottom: 12px;
        color: #5c6678;
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        color: #e8dcc2;
        background: rgba(11, 14, 20, 0.55);
        border: 1px solid rgba(232, 220, 194, 0.25);
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        letter-spacing: 0.05em;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 5;
      }
      #hint.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <div class="title">Emberwick Vale</div>
      <div class="bar"><div id="loading-bar"></div></div>
      <button id="start-btn" type="button">Spielen</button>
      <div id="controls-hint">WASD — Bewegen &nbsp;·&nbsp; Shift — Rennen &nbsp;·&nbsp; E — Interagieren &nbsp;·&nbsp; Maus — Kamera</div>
      <div id="boot-error"></div>
      <div id="version-tag"></div>
    </div>
    <div id="hint"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

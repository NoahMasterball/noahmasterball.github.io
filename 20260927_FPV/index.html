<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counterweight</title>
    <!-- No favicon asset: an empty data URL stops the browser's automatic /favicon.ico request
         (a 404 console error outside our sub-directory). -->
    <link rel="icon" href="data:," />
    <style>
      /* Shared UI tokens (ADR-0007): every HUD/menu colour and font comes from here. */
      :root {
        --fg: #f4f1ea;
        --fg-dim: rgba(244, 241, 234, 0.62);
        --panel: rgba(14, 16, 20, 0.62);
        --panel-strong: rgba(14, 16, 20, 0.86);
        --line: rgba(244, 241, 234, 0.18);
        --accent: #ffb547;
        --danger: #ff5a4a;
        --head: #ffd34a;
        --ok: #5fe0a0;
        --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        --radius: 6px;
        /* --ally and --enemy (team colours as the local player sees them) are set at boot from
           TEAM_STYLE in src/config/client.ts, the one source shared with the 3D torso bands;
           --shield from ABILITY_VISUALS.shield, the colour of the 3D shield shell. */
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101216;
        color: var(--fg);
        font-family: var(--font);
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .hidden {
        display: none !important;
      }

      /* ── Loading ── */
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 18px;
        background: #101216;
        text-align: center;
        z-index: 30;
        transition: opacity 0.4s;
      }
      #loading .title {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      #loading .bar {
        width: 320px;
        height: 4px;
        background: var(--line);
        border-radius: 2px;
        overflow: hidden;
      }
      #loading-bar {
        width: 0;
        height: 100%;
        background: var(--accent);
        transition: width 0.2s;
      }
      #boot-error {
        max-width: 560px;
        color: var(--danger);
        line-height: 1.5;
      }

      /* ── Menu ── */
      .menu {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 9, 12, 0.55);
        backdrop-filter: blur(3px);
        z-index: 20;
        pointer-events: auto;
      }
      .menu-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        max-width: 920px;
        padding: 28px 32px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .menu h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: 0.16em;
      }
      .menu h2 {
        margin: 18px 0 8px;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg-dim);
      }
      .menu .version {
        color: var(--fg-dim);
        font-size: 12px;
      }
      /* The primary / secondary buttons, shared with the Relay operator select screen. */
      .menu .play,
      .opsel-ready {
        margin-top: 18px;
        padding: 12px 28px;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #15171b;
        background: var(--accent);
        border: 0;
        border-radius: var(--radius);
        cursor: pointer;
      }
      .menu .message {
        margin-top: 10px;
        min-height: 1.2em;
        color: var(--danger);
        font-size: 13px;
      }
      .menu table {
        border-collapse: collapse;
        font-size: 13px;
      }
      .menu td {
        padding: 3px 12px 3px 0;
      }
      .menu td:first-child {
        color: var(--accent);
        font-family: var(--mono);
        white-space: nowrap;
      }
      .setting {
        display: grid;
        grid-template-columns: 1fr 120px 44px;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
        font-size: 13px;
      }
      .setting input[type='range'] {
        width: 100%;
      }
      .setting .value {
        font-family: var(--mono);
        color: var(--fg-dim);
        text-align: right;
      }
      .setting select {
        width: 100%;
        padding: 3px 4px;
        font: inherit;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .setting select option {
        background: #15171b;
      }
      .menu .note {
        margin: 4px 0 2px;
        font-size: 12px;
        color: var(--fg-dim);
      }
      .menu .secondary,
      .opsel-menu {
        margin-top: 8px;
        padding: 6px 16px;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        cursor: pointer;
      }

      /* ── HUD ── */
      .crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
      }
      .crosshair i {
        position: absolute;
        background: var(--fg);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
      }
      .crosshair .dot {
        width: 3px;
        height: 3px;
        left: -1.5px;
        top: -1.5px;
        border-radius: 50%;
      }
      .hitmarker {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        opacity: 0;
      }
      .hitmarker::before,
      .hitmarker::after {
        content: '';
        position: absolute;
        left: 12px;
        top: -2px;
        width: 2px;
        height: 30px;
        background: var(--fg);
        box-shadow: 0 0 2px #000;
        transform: rotate(45deg);
        clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%, 0 65%, 100% 65%, 100% 100%, 0 100%);
      }
      .hitmarker::after {
        transform: rotate(-45deg);
      }
      .hitmarker.head::before,
      .hitmarker.head::after {
        background: var(--head);
      }
      .hitmarker.shield::before,
      .hitmarker.shield::after {
        background: var(--shield);
      }
      .hitmarker.kill::before,
      .hitmarker.kill::after {
        background: var(--danger);
        width: 3px;
      }
      /* Size, ring radius and stroke width come from HUD.damageIndicator (src/config/client.ts). */
      .damage-indicator {
        position: absolute;
        left: 50%;
        top: 50%;
        overflow: visible;
        fill: none;
        stroke: var(--danger);
        stroke-linecap: round;
        filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.9));
      }
      .panel {
        position: absolute;
        padding: 10px 14px;
        background: var(--panel);
        border-radius: var(--radius);
        font-size: 14px;
      }
      .panel .big {
        font-size: 30px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .panel .dim {
        color: var(--fg-dim);
        font-size: 12px;
      }
      .bar {
        height: 6px;
        margin-top: 6px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        background: var(--ok);
      }
      /* Health bar: health, then shields (temporary HP) as a second segment. */
      .bar.health {
        display: flex;
      }
      .bar > div.shield {
        background: var(--shield);
      }
      .panel .shield-amount,
      .panel .heal-amount {
        font-size: 20px;
      }
      .shield-amount {
        color: var(--shield);
      }
      .heal-amount {
        color: var(--ok);
      }
      /* Under the crosshair, inside the damage-indicator ring: the channel bar (size from
         HUD.abilities.channelBar) and the placing hint. */
      .channel-bar {
        position: absolute;
        left: 50%;
        top: calc(50% + 44px);
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      .channel-bar > div {
        height: 100%;
        background: var(--accent);
      }
      .placing-hint {
        position: absolute;
        left: 50%;
        top: calc(50% + 56px);
        transform: translateX(-50%);
        padding: 3px 10px;
        font-size: 12px;
        text-align: center;
        white-space: nowrap;
        background: var(--panel);
        border-radius: var(--radius);
      }
      .placing-hint .fail {
        color: var(--danger);
        font-weight: 700;
      }
      .placing-hint .fail:empty {
        display: none;
      }
      /* Below the round HUD and Relay's objective line (.objective-strip). */
      .revealed-warning {
        position: absolute;
        top: 128px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 14px;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.16em;
        color: var(--enemy);
        background: var(--panel-strong);
        border: 1px solid var(--enemy);
        border-radius: var(--radius);
      }
      .abilities {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
      }
      .ability {
        position: relative;
        /* Fits the longest detail line ("2 left this round · 0/1 placed") without wrapping. */
        width: 160px;
        padding: 8px 10px;
        background: var(--panel);
        border-radius: var(--radius);
        font-size: 12px;
        border: 1px solid var(--line);
        --ready: 1;
        background-image: linear-gradient(90deg, rgba(255, 181, 71, 0.35) calc(var(--ready) * 100%), transparent 0);
      }
      .ability b {
        color: var(--accent);
        font-family: var(--mono);
      }
      .ability.unavailable {
        opacity: 0.45;
      }
      .ability.active {
        border-color: var(--accent);
      }
      .ability.placing {
        border-color: var(--ok);
      }
      .ability.failed {
        border-color: var(--danger);
      }
      .ability .fail {
        color: var(--danger);
      }
      /* A running channel or toggle: a line along the bottom (--progress, full for an untimed toggle). */
      .ability.active::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: calc(var(--progress) * 100%);
        background: var(--accent);
      }
      .hint {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 10px;
        font-size: 12px;
        color: var(--fg-dim);
        /* On a panel like the other HUD text: bare dim text vanishes against a bright sky. */
        background: var(--panel);
        border-radius: var(--radius);
      }
      .world-label {
        position: absolute;
        transform: translate(-50%, -50%);
        white-space: nowrap;
      }
      .healthbar {
        height: 5px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 3px;
        overflow: hidden;
        outline: 1px solid rgba(255, 255, 255, 0.25);
      }
      .healthbar > div {
        height: 100%;
        background: var(--danger);
      }
      .damage-number {
        font-weight: 800;
        font-size: 18px;
        color: var(--fg);
        text-shadow: 0 1px 3px #000;
      }
      .damage-number.head {
        color: var(--head);
        font-size: 22px;
      }
      /* Reveal marker (size and lift from HUD.reveal): a downward triangle whose tip sits just
         above the head. */
      .reveal-marker {
        transform: translate(-50%, -100%);
        filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.9));
      }
      .reveal-marker > i {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--enemy);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
      }
      /* ── Round HUD, banners, kill feed (SPEC §14 top and transient) ── */
      .round-hud {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: stretch;
        gap: 6px;
      }
      .rh-team {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 128px;
        padding: 6px 12px;
        background: var(--panel);
        border-radius: var(--radius);
        border-bottom: 3px solid var(--ally);
        color: var(--ally);
      }
      .rh-team.enemy {
        flex-direction: row-reverse;
        border-bottom-color: var(--enemy);
        color: var(--enemy);
      }
      .rh-score {
        font-size: 30px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--fg);
      }
      .rh-side {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      .rh-team.enemy .rh-side {
        text-align: right;
      }
      .rh-pips {
        display: flex;
        gap: 4px;
        margin-top: 4px;
      }
      .rh-team.enemy .rh-pips {
        flex-direction: row-reverse;
      }
      .rh-pips i {
        width: 9px;
        height: 14px;
        border-radius: 2px;
        background: currentColor;
      }
      .rh-pips i.dead {
        opacity: 0.2;
      }
      .rh-center {
        min-width: 160px;
        padding: 4px 14px;
        text-align: center;
        background: var(--panel-strong);
        border-radius: var(--radius);
      }
      .rh-caption {
        min-height: 1.3em;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg-dim);
      }
      .rh-clock {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .rh-clock.urgent {
        color: var(--danger);
      }
      .rh-round {
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--fg-dim);
      }
      .round-banner {
        position: absolute;
        top: 23%;
        left: 50%;
        transform: translateX(-50%);
        min-width: 420px;
        max-width: 70vw;
        padding: 14px 28px;
        text-align: center;
        background: var(--panel-strong);
        border-top: 3px solid var(--fg-dim);
        border-radius: var(--radius);
      }
      .round-banner.win {
        border-top-color: var(--ok);
      }
      .round-banner.loss {
        border-top-color: var(--danger);
      }
      .rb-title {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }
      .round-banner.win .rb-title {
        color: var(--ok);
      }
      .round-banner.loss .rb-title {
        color: var(--danger);
      }
      .rb-detail {
        margin-top: 6px;
        font-size: 16px;
      }
      .rb-note {
        margin-top: 8px;
        font-size: 12px;
        color: var(--fg-dim);
      }
      .round-banner.final {
        top: 30%;
        padding: 26px 48px;
      }
      .round-banner.final .rb-title {
        font-size: 56px;
      }
      .kill-feed {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
      .kill {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 10px;
        font-size: 13px;
        font-weight: 600;
        background: var(--panel);
        border-radius: var(--radius);
      }
      .kill .self {
        color: var(--accent);
      }
      .kill .ally {
        color: var(--ally);
      }
      .kill .enemy {
        color: var(--enemy);
      }
      .kill .weapon {
        font-size: 12px;
        font-weight: 400;
        color: var(--fg-dim);
      }
      .kill .weapon.ability {
        font-style: italic;
        color: var(--fg);
      }
      .kill .headshot {
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--head);
      }
      .debug {
        position: absolute;
        top: 12px;
        left: 12px;
        margin: 0;
        padding: 10px 12px;
        background: var(--panel-strong);
        border-radius: var(--radius);
        font: 12px/1.45 var(--mono);
        white-space: pre;
      }

      /* ── Relay (ADR-0013 §8): operator select, objective line, prompt, world markers ── */
      /* Operator select screen (free pointer); --op-color is each operator's accent (from data),
         --cards the number of cards. */
      .opsel {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 9, 12, 0.6);
        backdrop-filter: blur(3px);
        pointer-events: auto;
      }
      .opsel-panel {
        width: min(1180px, calc(100vw - 48px));
        max-height: calc(100vh - 48px);
        overflow: auto;
        box-sizing: border-box;
        padding: 22px 26px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .opsel-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
      }
      .opsel-overline {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .opsel-title {
        margin-top: 2px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .opsel-detail {
        margin-top: 4px;
        font-size: 15px;
      }
      .opsel-note {
        margin-top: 4px;
        font-size: 13px;
        color: var(--fg-dim);
      }
      .opsel-countdown {
        min-width: 64px;
        padding: 4px 14px;
        font-size: 40px;
        font-weight: 800;
        text-align: center;
        font-variant-numeric: tabular-nums;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .opsel-cards {
        display: grid;
        grid-template-columns: repeat(var(--cards), minmax(0, 1fr));
        gap: 12px;
      }
      .opsel-card {
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding: 12px 14px;
        font: inherit;
        font-size: 13px;
        text-align: left;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 4px solid var(--op-color);
        border-radius: var(--radius);
        cursor: pointer;
      }
      .opsel-card:hover:not(:disabled),
      .opsel-card.selected {
        border-color: var(--op-color);
      }
      .opsel-card.selected {
        box-shadow: inset 0 0 0 1px var(--op-color);
      }
      .opsel-card:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .opsel-card-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .opsel-key {
        padding: 0 5px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .opsel-name {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--op-color);
      }
      .opsel-arch {
        margin-left: auto;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg-dim);
      }
      .opsel-stats,
      .opsel-dim,
      .opsel-picks {
        color: var(--fg-dim);
      }
      .opsel-stats {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .opsel-caption {
        margin-bottom: 2px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg-dim);
      }
      .opsel-tag {
        font-size: 11px;
        color: var(--ok);
      }
      .opsel-bio {
        font-size: 12px;
        font-style: italic;
        line-height: 1.35;
        color: var(--fg-dim);
      }
      .opsel-card-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: auto;
        padding-top: 8px;
        font-size: 12px;
        border-top: 1px solid var(--line);
      }
      .opsel-pips {
        display: flex;
        gap: 3px;
      }
      .opsel-pips i {
        width: 10px;
        height: 10px;
        box-sizing: border-box;
        border: 1px solid var(--op-color);
        border-radius: 2px;
      }
      .opsel-pips i.taken {
        background: var(--op-color);
      }
      .opsel-badge {
        margin-left: auto;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--op-color);
      }
      .opsel-card:disabled .opsel-badge {
        color: var(--danger);
      }
      .opsel-team {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }
      .opsel-team .opsel-caption {
        margin: 0;
      }
      .opsel-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .opsel-chip {
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--op-color);
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 3px solid var(--op-color);
        border-radius: var(--radius);
      }
      .opsel-chip.you {
        border-color: var(--op-color);
      }
      .opsel-foot {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }
      .opsel-keys {
        margin-right: auto;
        font-size: 12px;
        color: var(--fg-dim);
      }
      .opsel-foot button {
        margin-top: 0;
      }
      /* The objective line (and, while selecting with a locked pointer, the select strip) sits
         under the round HUD. */
      .opsel-strip,
      .objective-strip {
        position: absolute;
        top: 88px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 12px;
        font-size: 13px;
        white-space: nowrap;
        background: var(--panel);
        border-radius: var(--radius);
      }
      .opsel-strip b {
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }
      .os-side {
        padding: 1px 8px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        color: #15171b;
        background: var(--ally);
        border-radius: 3px;
      }
      .os-uplink {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 10px;
        font-weight: 700;
        border-left: 1px solid var(--line);
      }
      .os-uplink .bar {
        width: 160px;
        margin-top: 0;
      }
      .os-uplink.own .bar > div {
        background: var(--ally);
      }
      .os-uplink.enemy .bar > div {
        background: var(--enemy);
      }
      .os-uplink-left {
        font-variant-numeric: tabular-nums;
      }
      /* Under the crosshair, below the ability channel bar and placing hint. */
      .objective-prompt {
        position: absolute;
        top: calc(50% + 64px);
        left: 50%;
        transform: translateX(-50%);
        min-width: 220px;
        padding: 5px 12px;
        font-size: 13px;
        text-align: center;
        white-space: nowrap;
        background: var(--panel);
        border-radius: var(--radius);
      }
      .objective-prompt b {
        margin-right: 6px;
        padding: 0 6px;
        font-family: var(--mono);
        color: #15171b;
        background: var(--accent);
        border-radius: 3px;
      }
      .objective-prompt .bar > div {
        background: var(--accent);
      }
      /* World markers: the badge is centred on the point, the line hangs below it. */
      .objective-marker {
        transform: translate(-50%, -15px);
        text-align: center;
        filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.9));
      }
      .objective-marker.dim {
        opacity: 0.45;
      }
      .om-badge {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        margin: 0 auto;
        box-sizing: border-box;
        font-size: 17px;
        font-weight: 800;
        color: var(--fg);
        background: var(--panel-strong);
        border: 2px solid var(--fg);
        border-radius: 50%;
      }
      .objective-marker.uplink .om-badge {
        border-radius: 4px;
      }
      .objective-marker.own .om-badge {
        color: var(--ally);
        border-color: var(--ally);
      }
      .objective-marker.enemy .om-badge {
        color: var(--enemy);
        border-color: var(--enemy);
      }
      .om-detail {
        margin-top: 3px;
        font-size: 12px;
        font-weight: 600;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="layer"></div>
    <div id="loading">
      <div class="title" id="loading-title"></div>
      <div class="bar"><div id="loading-bar"></div></div>
      <div id="boot-error"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
